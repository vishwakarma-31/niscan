services:
  postgres:
    image: postgres:15-alpine
    container_name: nicsan-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nicsan_crm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nicsan_crm"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nicsan-backend
    environment:
      PORT: 5000
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/nicsan_crm
      JWT_SECRET: nicsan_jwt_secret_key_32_chars_minimum_required
      JWT_REFRESH_SECRET: nicsan_refresh_secret_key_32_chars_minimum_required
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
      AWS_REGION: ap-south-1
      S3_BUCKET_NAME: ""
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      FRONTEND_URL: http://localhost:4173
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/migrations:/app/migrations:ro
    command: docker-entrypoint.sh
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nicsan-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:5000/api
    ports:
      - "4173:4173"
    depends_on:
      - backend

volumes:
  postgres_data: